name: 构建 Windows 程序

# 只做持续集成验证；发版（打标签出 Release）由 release.yml 负责
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  # 自检步骤要把结果写回仓库（这样不用登录 Actions 页面也能看到详情）
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # win-x64 覆盖绝大多数机器；self-contained 版本方便拷到没装 .NET 的电脑上
        include:
          - runtime: win-x64
            self_contained: false
            artifact: DesktopOrganizer-win-x64
          - runtime: win-x64
            self_contained: true
            artifact: DesktopOrganizer-win-x64-standalone

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原应用图标
        shell: pwsh
        run: |
          $ico = "src/DesktopOrganizer/Assets/app.ico"
          $b64 = "tools/app-icon.b64.txt"
          if (Test-Path $b64) {
            New-Item -ItemType Directory -Force -Path (Split-Path $ico -Parent) | Out-Null
            $bytes = [System.Convert]::FromBase64String(((Get-Content $b64 -Raw) -replace '\s', ''))
            [System.IO.File]::WriteAllBytes($ico, $bytes)
            Write-Host "已还原 $ico"
          }

      # 注意：restore 必须带上 -r（runtime identifier），否则 assets 文件里没有
      # 对应平台的目标，后面的 --no-restore build 会报 NETSDK1047。
      - name: 还原依赖
        run: dotnet restore src/DesktopOrganizer/DesktopOrganizer.csproj -r ${{ matrix.runtime }}

      # 说明：这里刻意不加 -warnaserror。不同 SDK 小版本会冒出新的告警
      # （例如 NuGet 供应链审计 NU19xx），本地干净不代表 CI 干净，
      # 不应该让这类与代码无关的差异把 CI 卡红。
      - name: 编译
        run: >
          dotnet build src/DesktopOrganizer/DesktopOrganizer.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --no-restore

      - name: 发布
        run: >
          dotnet publish src/DesktopOrganizer/DesktopOrganizer.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained ${{ matrix.self_contained }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.self_contained }}
          -p:EnableCompressionInSingleFile=${{ matrix.self_contained }}
          -p:DebugType=embedded
          --nologo

      # 真把程序跑起来做冒烟自检。很多问题（区域性、WPF 文本排版、Shell 图标）
      # 编译期完全看不出来，只在真机运行时才炸，光能编译通过靠不住。
      - name: 冒烟自检
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "src/DesktopOrganizer/bin/Release/net8.0-windows/${{ matrix.runtime }}/publish/DesktopOrganizer.exe"
          if (-not (Test-Path $exe)) { Write-Host "找不到产物：$exe"; exit 1 }

          $out = "selftest-${{ matrix.artifact }}.txt"
          $p = Start-Process -FilePath $exe -ArgumentList @("--selftest","--out=$out") -Wait -PassThru -NoNewWindow
          $code = $p.ExitCode

          $text = if (Test-Path $out) { Get-Content $out -Raw } else { "(程序没有产生任何输出 —— 多半是没能启动起来)" }
          $text += "`n退出码：$code`n"

          Write-Host "----- 自检日志 -----"
          Write-Host $text
          Write-Host "-------------------"

          if ($code -eq 0) { Write-Host "自检全部通过"; exit 0 }

          # 只在失败时把详情写回仓库：Action 日志要管理员权限才拿得到，
          # 写回文件后直接看仓库里的 .ci/ 即可，不用登到 Actions 页面翻。
          $target = ".ci/selftest-${{ matrix.artifact }}.log"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "ci" }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$target"
          $body = @{ message = "CI 自检失败详情（${{ matrix.artifact }}）"; content = $b64; branch = "main" }
          try {
            $old = Invoke-RestMethod -Headers $headers -Uri $api -ErrorAction Stop
            $body.sha = $old.sha
          } catch { }
          try {
            Invoke-RestMethod -Method Put -Headers $headers -Uri $api `
              -Body ($body | ConvertTo-Json) -ContentType "application/json" | Out-Null
          } catch { Write-Host "写回日志失败（不影响构建结果）：$_" }

          exit 1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src/DesktopOrganizer/bin/Release/net8.0-windows/${{ matrix.runtime }}/publish/DesktopOrganizer.exe
          if-no-files-found: error
