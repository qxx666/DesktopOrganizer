name: 发布 Release

# 两种触发方式：
#   1. 推送 v* 标签（如 git tag v1.0.0 && git push origin v1.0.0）—— 推荐
#   2. 仓库页面 → Actions → 选「发布 Release」→ Run workflow → 填版本号
# 都会构建两个版本并把 exe 挂到 Release 上供下载。
#
# 前置条件（只需设一次）：仓库 Settings → Actions → General → 最下方
# 「Workflow permissions」必须选 **Read and write permissions**，
# 否则最后一步创建 Release 会因 token 只读而失败。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v1.0.0'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原应用图标
        shell: pwsh
        run: |
          $ico = "src/DesktopOrganizer/Assets/app.ico"
          $b64 = "tools/app-icon.b64.txt"
          if (Test-Path $b64) {
            New-Item -ItemType Directory -Force -Path (Split-Path $ico -Parent) | Out-Null
            $bytes = [System.Convert]::FromBase64String(((Get-Content $b64 -Raw) -replace '\s', ''))
            [System.IO.File]::WriteAllBytes($ico, $bytes)
            Write-Host "已还原 $ico"
          }

      - name: 构建独立版（免 .NET 运行时，约 63 MB）
        run: >
          dotnet publish src/DesktopOrganizer/DesktopOrganizer.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o standalone
          --nologo

      - name: 构建精简版（需 .NET 8 运行时，约 0.4 MB）
        run: >
          dotnet publish src/DesktopOrganizer/DesktopOrganizer.csproj
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o slim
          --nologo

      - name: 解析版本号
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      # 版本号一致性闸门：csproj 里的 <Version> 必须与标签一致。
      # 曾经发生过「标签已到 v1.1.2、exe 属性还是 1.0.0」的漂移，
      # 用户右键 exe 看属性会分不清版本。这里强制同步。
      - name: 校验程序集版本与标签一致
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}" -replace '^v', ''
          $csproj = [xml](Get-Content src/DesktopOrganizer/DesktopOrganizer.csproj -Raw)
          $assembly = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          Write-Host "标签版本：$tag；程序集版本：$assembly"
          if ($assembly -ne $tag) {
            Write-Host "::error::csproj 里的 <Version> 是 $assembly，与标签 v$tag 不一致。请先更新 src/DesktopOrganizer/DesktopOrganizer.csproj 再打标签。"
            exit 1
          }

      - name: 整理待发布文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # 文件名只用 ASCII：GitHub Release 的附件名会丢掉非 ASCII 字符，
          # 两个中文名会被同化成同一个文件，导致互相覆盖。
          Copy-Item standalone/DesktopOrganizer.exe out/DesktopOrganizer-standalone.exe
          Copy-Item slim/DesktopOrganizer.exe       out/DesktopOrganizer-slim.exe
          Get-ChildItem out | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,2)) MB" }

      - name: 打标签并创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: 桌面分区管家 ${{ steps.vars.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            ## 桌面分区管家 ${{ steps.vars.outputs.tag }}

            在 Windows 桌面上划分分区框，把文件拖进去即可自动归类。

            ### 下载哪个？

            | 文件 | 体积 | 说明 |
            | --- | --- | --- |
            | `DesktopOrganizer-standalone.exe` | 约 63 MB | **推荐**。双击即用，不需要安装 .NET 运行时 |
            | `DesktopOrganizer-slim.exe` | 约 0.4 MB | 需要本机已装 .NET 8 桌面运行时 |

            下载后双击运行，程序会驻留在系统托盘，默认快捷键 `Ctrl+Alt+D` 显示/隐藏全部分区。

            ### 注意
            拖进分区 = 文件被真实移动到 `%USERPROFILE%\DesktopZones\<分区名>\`，不是快捷方式。
            删除文件走系统回收站，删分区不会删除里面的文件。
          files: |
            out/DesktopOrganizer-standalone.exe
            out/DesktopOrganizer-slim.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 仅当上面的发布失败时才执行，把关键诊断信息打到运行日志里，
      # 用于区分「令牌权限不足」和「文件路径不对」两类问题。
      - name: 诊断失败原因
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "=== ref 信息 ==="
          Write-Host "ref=${{ github.ref }}"
          Write-Host "ref_type=${{ github.ref_type }}"
          Write-Host "ref_name=${{ github.ref_name }}"
          Write-Host "=== 待发布文件 ==="
          Get-ChildItem out -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }
          Write-Host "=== 当前令牌对该仓库的权限 ==="
          gh api repos/${{ github.repository }} --jq '.permissions'
          Write-Host "=== Actions 工作流权限设置 ==="
          gh api repos/${{ github.repository }}/actions/permissions/workflow
